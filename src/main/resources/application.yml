# ============================================================
# ba-sync — 币安数据同步服务配置 (只写MySQL, 不做分析)
# ============================================================

server:
  port: 8081

spring:
  datasource:
    # 环境相关项(url/username/password)请放到 jar 外的 config/application.yml 覆盖,
    # 见 config/application.yml.example。此处仅留本地默认值; 密码默认空 → 必须由外部配置
    # 或环境变量 DB_PASSWORD 提供, 避免明文密钥进 jar / git。
    # rewriteBatchedStatements=true: 让 JDBC batchUpdate 真正合并成多值 INSERT 一次发送,
    # 否则 MySQL 驱动逐行发网络包, upsert 批量写退化为 N 次往返。
    url: jdbc:mysql://127.0.0.1:3306/ba?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

binance:
  base-url: https://fapi.binance.com

  proxy:
    enabled: true    # 部署VPS可直连币安; 本地开发需走代理时改回 true
    host: 127.0.0.1
    port: 7897

  concurrency:
    max-requests: 10
    request-interval-ms: 100
    history-buffer-days: 30
    task-timeout-seconds: 120

  # 启动数据完整性校验: 系统就绪后逐 symbol 比对记录数, 缺则补齐。
  init:
    enabled: true
    daily:                 # 日线级: 日K / 日线OI / 资金费率 (币安原生UTC日界)
      days: 30
      tolerance-days: 2    # 记录数 >= days-tolerance 视为完整, 吸收日界/结算时点抖动

  symbol:
    file-path: ./data/symbols.json

  # 多空比采集配置 (4端点: 全市场账户/顶级账户/顶级持仓/Taker比率)
  lsr:
    enabled: true
    period: 1h
    limit: 30

  schedule:
    # JVM 固定 Asia/Shanghai 运行 (见 SyncApplication)。以下 cron 均为北京时间。
    symbol-update: "0 0 6 * * ?"
    # 高频: 1d/1h K线(含当前动态根) + 24h行情 + 标记价/溢价
    short-term-sync: "0 */3 * * * ?"
    # 4h K线: interval 粗, 15分钟一轮足够 (起始分钟错开 */3 的整点)
    four-hour-kline-sync: "0 1/15 * * * ?"
    # 资金费率: 8h 结算一次, 每小时一轮足够 (原先在3分钟任务里逐symbol重复拉取纯属浪费配额)
    funding-rate-sync: "0 5 * * * ?"
    # 每日同步日线OI (北京时间8:20, UTC零点已过, 币安当日1d点已生成)。
    # upsert+永不删除 → 日线OI序列随时间无限累积, 突破币安openInterestHist的30天上限。
    daily-oi-sync: "0 10 8 * * ?"
    # 中频: 1h OI + 多空比 (吃 /futures/data 次数桶, 故 30 分钟一轮, 不进高频)
    mid-freq-sync: "0 */30 * * * ?"
